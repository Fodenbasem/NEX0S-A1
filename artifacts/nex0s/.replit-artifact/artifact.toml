kind = "web"
previewPath = "/"
title = "NEX0S A1"
version = "1.0.0"
id = "artifacts/nex0s"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18723

[services.development]
run = "pnpm --filter @workspace/nex0s run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nex0s", "run", "build" ]
publicDir = "artifacts/nex0s/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18723"
BASE_PATH = "/"
